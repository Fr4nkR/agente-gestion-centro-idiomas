<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agente</title>
  <link rel="icon" href="/static/logo-upc.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* Colores institucionales UPC */
    :root {
      --rojo: #e52521;
      --rojo-oscuro: #b81c19;
      --rojo-suave: #fdecec;
      --fondo: #f5f5f7;
      --tarjeta: #ffffff;
      --texto: #1f1f24;
      --texto-suave: #6b6b76;
      --borde: #e4e4ea;
      --sombra: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
      --radio: 14px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
    }

    /* ===== Barra superior ===== */
    .barra {
      background: linear-gradient(135deg, var(--rojo) 0%, var(--rojo-oscuro) 100%);
      color: #fff;
      box-shadow: 0 2px 12px rgba(184, 28, 25, .25);
    }
    .barra-interior {
      max-width: 1180px; margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; gap: 14px;
    }
    .logo {
      width: 52px; height: 52px; flex-shrink: 0;
      background: #fff; border-radius: 50%;
      display: grid; place-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .logo img { width: 40px; height: 40px; object-fit: contain; }
    .marca { min-width: 0; }
    .marca h1 { margin: 0; font-size: clamp(18px, 4vw, 24px); font-weight: 700; letter-spacing: -.01em; }
    .marca .institucion { margin: 2px 0 0; font-size: 13px; opacity: .9; }
    .autor { margin-left: auto; font-size: 11px; opacity: .8; text-align: right; max-width: 260px; }

    /* ===== Contenido ===== */
    .contenedor {
      max-width: 1180px; margin: 0 auto; padding: 20px;
      display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start;
    }
    .tarjeta {
      background: var(--tarjeta); border: 1px solid var(--borde);
      border-radius: var(--radio); box-shadow: var(--sombra);
    }

    /* Chat */
    main.tarjeta { display: flex; flex-direction: column; overflow: hidden; }
    #chat {
      height: 62vh; min-height: 320px; overflow-y: auto;
      padding: 20px; display: flex; flex-direction: column; gap: 10px;
      overflow-wrap: anywhere; scroll-behavior: smooth;
    }
    .bienvenida {
      margin: auto; text-align: center; color: var(--texto-suave); max-width: 380px; padding: 20px;
    }
    .bienvenida img { width: 64px; height: 64px; opacity: .9; }
    .bienvenida h3 { margin: 10px 0 6px; color: var(--texto); font-size: 18px; }
    .bienvenida p { margin: 0; font-size: 14px; line-height: 1.5; }

    .mensaje {
      max-width: 80%; padding: 10px 14px; border-radius: 16px;
      line-height: 1.5; font-size: 15px; white-space: pre-wrap;
      animation: aparecer .2s ease-out;
    }
    .usuario {
      align-self: flex-end; background: var(--rojo); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .agente {
      align-self: flex-start; background: #f0f0f3; color: var(--texto);
      border-bottom-left-radius: 4px;
    }
    .escribiendo span {
      display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%;
      background: var(--texto-suave); animation: rebote 1s infinite ease-in-out;
    }
    .escribiendo span:nth-child(2) { animation-delay: .15s; }
    .escribiendo span:nth-child(3) { animation-delay: .3s; }
    .grafico {
      align-self: stretch; background: #fff; border: 1px solid var(--borde);
      border-radius: 12px; padding: 12px; animation: aparecer .2s ease-out;
    }
    canvas { max-width: 100%; }

    @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes rebote { 0%, 80%, 100% { transform: scale(.6); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }

    /* Barra de escritura */
    .zona-entrada { border-top: 1px solid var(--borde); padding: 12px 14px; background: #fafafb; }
    form { display: flex; gap: 8px; align-items: center; }
    input[type=text] {
      flex: 1 1 200px; min-width: 0; padding: 12px 16px; font: inherit; font-size: 16px;
      border: 1px solid var(--borde); border-radius: 999px; background: #fff; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type=text]:focus { border-color: var(--rojo); box-shadow: 0 0 0 3px rgba(229, 37, 33, .15); }

    button { font: inherit; cursor: pointer; }
    .boton {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px 18px; font-size: 15px; font-weight: 600; border-radius: 999px;
      border: 1px solid transparent; transition: background .15s, transform .05s, color .15s;
    }
    .boton:active { transform: scale(.97); }
    .boton svg { width: 18px; height: 18px; }
    .boton-principal { background: var(--rojo); color: #fff; }
    .boton-principal:hover { background: var(--rojo-oscuro); }
    .boton-secundario { background: #fff; color: var(--rojo); border-color: var(--rojo); }
    .boton-secundario:hover { background: var(--rojo-suave); }
    .boton-secundario.activo { background: var(--rojo); color: #fff; animation: pulso 1.2s infinite; }
    .boton:disabled { opacity: .45; cursor: not-allowed; }
    @keyframes pulso { 0%,100% { box-shadow: 0 0 0 0 rgba(229,37,33,.5); } 50% { box-shadow: 0 0 0 8px rgba(229,37,33,0); } }

    .opciones { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 13px; color: var(--texto-suave); }
    .interruptor { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .interruptor input { accent-color: var(--rojo); width: 16px; height: 16px; }
    #estado { color: var(--rojo); font-weight: 500; }

    /* Leyenda */
    #leyenda { padding: 18px; position: sticky; top: 20px; }
    #leyenda h3 { margin: 0 0 4px; font-size: 16px; }
    #leyenda .nota { margin: 0 0 6px; font-size: 13px; color: var(--texto-suave); }
    #leyenda h4 {
      margin: 16px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
      color: var(--rojo); font-weight: 700;
    }
    .pregunta {
      display: block; width: 100%; text-align: left; margin-bottom: 6px;
      padding: 9px 12px; font-size: 13.5px; line-height: 1.35; color: var(--texto);
      background: #fafafb; border: 1px solid var(--borde); border-radius: 10px;
      transition: border-color .15s, background .15s, color .15s;
    }
    .pregunta:hover { border-color: var(--rojo); background: var(--rojo-suave); color: var(--rojo-oscuro); }

    /* Tableta y celular: todo en una columna */
    @media (max-width: 860px) {
      .contenedor { grid-template-columns: 1fr; }
      #leyenda { position: static; }
      #chat { height: 55vh; }
      .autor { display: none; }
      .pie-autor { display: block !important; }
    }
    /* Celular pequeño */
    @media (max-width: 480px) {
      .barra-interior, .contenedor { padding-left: 16px; padding-right: 16px; }
      .logo { width: 44px; height: 44px; }
      .logo img { width: 34px; height: 34px; }
      .marca .institucion { font-size: 11px; }
      .mensaje { max-width: 90%; }
      .boton .etiqueta { display: none; }
      .boton { padding: 11px 13px; }
    }
    .pie-autor { display: none; text-align: center; font-size: 11px; color: var(--texto-suave); padding: 0 16px 20px; }
  </style>
</head>
<body>
  <header class="barra">
    <div class="barra-interior">
      <div class="logo"><img src="/static/logo-upc.png" alt="Logo UPC"></div>
      <div class="marca">
        <h1 id="titulo"></h1>
        <p class="institucion">Universidad Peruana de Ciencias Aplicadas</p>
      </div>
      <span class="autor">Elaborado por: Henry Antonio Mendoza Puerta by hampcode</span>
    </div>
  </header>

  <div class="contenedor">
    <main class="tarjeta">
      <div id="chat">
        <div class="bienvenida" id="bienvenida">
          <img src="/static/logo-upc.png" alt="">
          <h3>¡Hola! ¿En qué te ayudo?</h3>
          <p>Escribe tu consulta, pulsa el micrófono o elige una pregunta de la lista.</p>
        </div>
      </div>
      <div class="zona-entrada">
        <form id="formulario">
          <input type="text" id="texto" autocomplete="off" placeholder="Escribe tu pregunta…">
          <button type="button" id="boton-hablar" class="boton boton-secundario" title="Hablar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
            <span class="etiqueta">Hablar</span>
          </button>
          <button class="boton boton-principal" title="Enviar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            <span class="etiqueta">Enviar</span>
          </button>
        </form>
        <div class="opciones">
          <label class="interruptor"><input type="checkbox" id="casilla-voz" checked> Respuesta en voz</label>
          <span id="estado"></span>
        </div>
      </div>
    </main>
    <aside id="leyenda" class="tarjeta"></aside>
  </div>
  <p class="pie-autor">Elaborado por: Henry Antonio Mendoza Puerta by hampcode</p>

  <script>
    // ===== HAMP EXPLICA: LO ÚNICO QUE CAMBIA ENTRE PROYECTOS =====
    const TITULO = "Agente de Matriculas"; // cambiar
    const PREGUNTAS = {
      "Consultas": [
        "¿Cuántas matrículas hay en total?",
        "Busca a Rosa Espinoza.",
        "¿Qué profesores enseñan francés?",
        "¿Qué alumnos estudian japonés?",
        "¿Cuánto se recaudó entre enero y marzo de 2026?",
        "¿Cuál es el método de pago más usado?"
      ],
      "Gráficos": [
        "Grafica lo recaudado por mes.",
        "Hazme un gráfico de barras de lo recaudado entre enero y junio de 2026."
      ],
      "Registros": [
        "Registra al alumno Carlos Díaz, masculino, de 22 años.",
        "Registra un curso de Kiara Romero Ruiz, nivel Intermedio, 400 soles, 10 semanas."
      ]
    };
    // ===============================================

    const cajaChat = document.getElementById("chat");
    const cajaTexto = document.getElementById("texto");
    const formulario = document.getElementById("formulario");
    const botonHablar = document.getElementById("boton-hablar");
    const casillaVoz = document.getElementById("casilla-voz");
    const mensajeEstado = document.getElementById("estado");
    const leyenda = document.getElementById("leyenda");

    document.title = TITULO + " · UPC";
    document.getElementById("titulo").textContent = TITULO;

    // Leyenda: una lista de botones; al pulsar uno se envía la pregunta
    leyenda.innerHTML = "<h3>Preguntas para probar</h3><p class='nota'>Pulsa una para enviarla.</p>";
    for (const grupo in PREGUNTAS) {
      const subtitulo = document.createElement("h4");
      subtitulo.textContent = grupo;
      leyenda.appendChild(subtitulo);

      for (const pregunta of PREGUNTAS[grupo]) {
        const boton = document.createElement("button");
        boton.type = "button";
        boton.className = "pregunta";
        boton.textContent = pregunta;
        boton.onclick = () => enviar(pregunta);
        leyenda.appendChild(boton);
      }
    }

    // Quita el mensaje de bienvenida cuando empieza la conversación
    function quitarBienvenida() {
      const bienvenida = document.getElementById("bienvenida");
      if (bienvenida) bienvenida.remove();
    }

    // Agrega un mensaje al chat
    function agregarMensaje(texto, clase) {
      quitarBienvenida();
      const mensaje = document.createElement("div");
      mensaje.className = "mensaje " + clase;
      mensaje.textContent = texto;
      cajaChat.appendChild(mensaje);
      cajaChat.scrollTop = cajaChat.scrollHeight;
      return mensaje;
    }

    // Dibuja un gráfico con Chart.js (colores UPC)
    function dibujarGrafico(grafico) {
      const marco = document.createElement("div");
      marco.className = "grafico";
      const lienzo = document.createElement("canvas");
      lienzo.style.maxHeight = "280px";
      marco.appendChild(lienzo);
      cajaChat.appendChild(marco);

      const esCircular = grafico.tipo === "pie" || grafico.tipo === "doughnut";
      const paleta = ["#e52521", "#3a3a44", "#f28b82", "#8a8a96", "#b81c19", "#c9c9d1"];
      new Chart(lienzo, {
        type: grafico.tipo,
        data: {
          labels: grafico.etiquetas,
          datasets: [{
            label: grafico.titulo,
            data: grafico.valores,
            backgroundColor: esCircular ? paleta : "rgba(229, 37, 33, .75)",
            borderColor: esCircular ? "#fff" : "#e52521",
            borderWidth: 2,
            borderRadius: grafico.tipo === "bar" ? 6 : 0,
            tension: .3,
            pointBackgroundColor: "#e52521"
          }]
        },
        options: {
          plugins: {
            title: { display: true, text: grafico.titulo, font: { family: "Inter", size: 14, weight: "600" } },
            legend: { display: esCircular }
          }
        }
      });
      cajaChat.scrollTop = cajaChat.scrollHeight;
    }

    // Envía la pregunta al servidor (POST /chat) y muestra la respuesta
    async function enviar(texto) {
      texto = texto.trim();
      if (!texto) return;

      agregarMensaje(texto, "usuario");
      const mensajeEspera = agregarMensaje("", "agente");
      mensajeEspera.innerHTML = '<span class="escribiendo"><span></span><span></span><span></span></span>';
      try {
        const respuestaHttp = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ texto })
        });
        const datos = await respuestaHttp.json();
        mensajeEspera.textContent = datos.respuesta || "(sin respuesta)";
        if (datos.grafico) dibujarGrafico(datos.grafico);
        leerEnVoz(datos.respuesta);
      } catch (error) {
        mensajeEspera.textContent = "Error: " + error;
      }
      cajaChat.scrollTop = cajaChat.scrollHeight;
    }

    // Al enviar el formulario
    formulario.onsubmit = (evento) => {
      evento.preventDefault();
      enviar(cajaTexto.value);
      cajaTexto.value = "";
    };

    // Voz -> texto (solo en Edge, Chrome y Safari)
    const ReconocimientoDeVoz = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!ReconocimientoDeVoz) {
      botonHablar.disabled = true;
      mensajeEstado.textContent = "Este navegador no permite voz.";
    } else {
      const reconocedor = new ReconocimientoDeVoz();
      reconocedor.lang = "es-PE";
      reconocedor.onresult = (resultado) => enviar(resultado.results[0][0].transcript);
      reconocedor.onend = () => { mensajeEstado.textContent = ""; botonHablar.classList.remove("activo"); };
      reconocedor.onerror = (error) => { mensajeEstado.textContent = "Micrófono: " + error.error; };
      botonHablar.onclick = () => {
        mensajeEstado.textContent = "Escuchando…";
        botonHablar.classList.add("activo");
        reconocedor.start();
      };
    }

    // Texto -> voz: lee la respuesta en voz alta
    function leerEnVoz(texto) {
      if (!casillaVoz.checked || !texto) return;
      speechSynthesis.cancel();
      speechSynthesis.speak(new SpeechSynthesisUtterance(texto));
    }
  </script>
</body>
</html>
